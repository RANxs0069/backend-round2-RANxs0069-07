spring:
  application:
    name: backend2_07

  # 从项目根目录的 .env 读取数据库账号和 JWT 密钥（.env 已在 .gitignore 中）
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/backend2_07?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai
    username: ${DB_USER:lrtask}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expire-ms: ${JWT_EXPIRE_MS:7200000}

app:
  password:
    # 新密码默认使用的算法：bcrypt / pbkdf2 / sha256 / noop
    # 库中存 {算法}散列 前缀，切换后老用户仍可登录
    algorithm: ${PASSWORD_ALGORITHM:bcrypt}

web:
  userService:
    register:
      usernameMin: 2
      usernameMax: 12
      passwordMin: 6
      passwordMax: 12